name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build package
        run: dotnet build lib-i18n-csharp/lib-i18n-csharp.sln --configuration Release

      - name: Run tests
        run: dotnet test lib-i18n-csharp/lib-i18n-csharp.sln --configuration Release --no-build
